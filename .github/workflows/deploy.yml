name: Deploy Frontend

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install & Build
        run: |
          npm install
          npm run build

      - name: Upload ke VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: ".output/*,package.json,nuxt.config.ts"
          target: "/var/www/surauzamzam/frontend"
          overwrite: true

      - name: Restart PM2 di VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            cd /var/www/surauzamzam/frontend
            
            # Memaksa pembacaan env
            set -a
            source .env.production
            set +a
            
            # Hanya instal dependensi production (sangat ringan)
            npm install --omit=dev
            
            # Menyalakan aplikasi
            pm2 restart frontend || pm2 start .output/server/index.mjs --name "frontend"
            pm2 save